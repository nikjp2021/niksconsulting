<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" fill="none">
  <defs>
    <radialGradient id="svc-bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#1e1b4b" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#030712" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hex-violet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/><stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="hex-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/><stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="hex-amber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/><stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
    <linearGradient id="hex-emerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/><stop offset="100%" stop-color="#14b8a6"/>
    </linearGradient>
    <linearGradient id="hex-pink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899"/><stop offset="100%" stop-color="#f43f5e"/>
    </linearGradient>
    <linearGradient id="hex-indigo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/><stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="conn-flow1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0"/><stop offset="50%" stop-color="#8b5cf6" stop-opacity="0.6"/><stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="conn-flow2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0"/><stop offset="50%" stop-color="#f59e0b" stop-opacity="0.5"/><stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </linearGradient>
    <filter id="svc-glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <style>
    @keyframes hex-pulse { 0%,100%{opacity:0.6} 50%{opacity:1} }
    @keyframes hex-float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-8px)} }
    @keyframes conn-flow { 0%{stroke-dashoffset:30} 100%{stroke-dashoffset:0} }
    @keyframes conn-flow2 { 0%{stroke-dashoffset:0} 100%{stroke-dashoffset:-30} }
    @keyframes shape-float { 0%,100%{transform:translateY(0) rotate(0deg)} 50%{transform:translateY(-15px) rotate(5deg)} }
    @keyframes shape-float2 { 0%,100%{transform:translateY(0) rotate(0deg)} 50%{transform:translateY(-10px) rotate(-3deg)} }
    @keyframes grid-pulse { 0%,100%{opacity:0.03} 50%{opacity:0.08} }
    @keyframes icon-spin { 0%,100%{transform:rotate(0deg)} 50%{transform:rotate(5deg)} }
    .hex-glow { animation: hex-pulse 4s ease-in-out infinite; }
    .hex-float { animation: hex-float 6s ease-in-out infinite; }
    .conn-anim { animation: conn-flow 3s linear infinite; stroke-dasharray: 6 8; }
    .conn-anim2 { animation: conn-flow2 3.5s linear infinite; stroke-dasharray: 5 10; }
    .shape-anim { animation: shape-float 8s ease-in-out infinite; }
    .shape-anim2 { animation: shape-float2 7s ease-in-out infinite; }
    .grid-anim { animation: grid-pulse 5s ease-in-out infinite; }
  </style>

  <!-- Background -->
  <rect width="1200" height="600" fill="#030712"/>
  <rect width="1200" height="600" fill="url(#svc-bg)"/>

  <!-- Grid pattern background -->
  <g class="grid-anim" opacity="0.05">
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#8b5cf6" stroke-width="0.5"/>
    </pattern>
    <rect width="1200" height="600" fill="url(#grid)"/>
  </g>

  <!-- Connection lines between hexagons -->
  <g opacity="0.4">
    <!-- Top row connections -->
    <line x1="440" y1="210" x2="600" y2="210" stroke="url(#conn-flow1)" stroke-width="1.2" class="conn-anim"/>
    <line x1="600" y1="210" x2="760" y2="210" stroke="url(#conn-flow1)" stroke-width="1.2" class="conn-anim" style="animation-delay: 0.5s;"/>
    <!-- Middle connections -->
    <line x1="360" y1="350" x2="520" y2="350" stroke="url(#conn-flow2)" stroke-width="1" class="conn-anim2"/>
    <line x1="520" y1="350" x2="680" y2="350" stroke="url(#conn-flow2)" stroke-width="1" class="conn-anim2" style="animation-delay: 0.5s;"/>
    <line x1="680" y1="350" x2="840" y2="350" stroke="url(#conn-flow1)" stroke-width="1" class="conn-anim" style="animation-delay: 1s;"/>
    <!-- Diagonal connections -->
    <line x1="440" y1="210" x2="360" y2="350" stroke="#8b5cf6" stroke-width="0.6" opacity="0.2" stroke-dasharray="4 6"/>
    <line x1="600" y1="210" x2="520" y2="350" stroke="#06b6d4" stroke-width="0.6" opacity="0.2" stroke-dasharray="4 6"/>
    <line x1="600" y1="210" x2="680" y2="350" stroke="#f59e0b" stroke-width="0.6" opacity="0.2" stroke-dasharray="4 6"/>
    <line x1="760" y1="210" x2="840" y2="350" stroke="#14b8a6" stroke-width="0.6" opacity="0.2" stroke-dasharray="4 6"/>
    <line x1="760" y1="210" x2="680" y2="350" stroke="#ec4899" stroke-width="0.6" opacity="0.15" stroke-dasharray="4 6"/>
    <line x1="440" y1="210" x2="520" y2="350" stroke="#6366f1" stroke-width="0.6" opacity="0.15" stroke-dasharray="4 6"/>
  </g>

  <!-- Hexagon 1: Violet (top-left) - AI Solutions -->
  <g class="hex-float" style="animation-delay: 0s;">
    <g transform="translate(440, 210)">
      <polygon points="0,-52 45,-26 45,26 0,52 -45,26 -45,-26" fill="#0f172a" stroke="url(#hex-violet)" stroke-width="2" opacity="0.85" class="hex-glow"/>
      <polygon points="0,-38 33,-19 33,19 0,38 -33,19 -33,-19" fill="none" stroke="#8b5cf6" stroke-width="0.5" opacity="0.2"/>
      <!-- Brain icon -->
      <g opacity="0.7" transform="translate(-12, -14)">
        <path d="M12 2C6.48 2 2 6.48 2 12c0 3.04 1.36 5.76 3.5 7.59V22h4v-2h1v2h4v-2.41C16.64 17.76 18 15.04 18 12c0-5.52-4.48-10-10-10zm-1 15H9v-2h2v2zm0-4H9v-2h2v2zm4 4h-2v-2h2v2zm0-4h-2v-2h2v2z" fill="#8b5cf6" opacity="0.8"/>
      </g>
    </g>
  </g>

  <!-- Hexagon 2: Cyan (top-center) - Automation -->
  <g class="hex-float" style="animation-delay: 1s;">
    <g transform="translate(600, 210)">
      <polygon points="0,-52 45,-26 45,26 0,52 -45,26 -45,-26" fill="#0f172a" stroke="url(#hex-cyan)" stroke-width="2" opacity="0.85" class="hex-glow" style="animation-delay: 0.5s;"/>
      <polygon points="0,-38 33,-19 33,19 0,38 -33,19 -33,-19" fill="none" stroke="#06b6d4" stroke-width="0.5" opacity="0.2"/>
      <!-- Bot/Robot icon -->
      <g opacity="0.7" transform="translate(-12, -14)">
        <rect x="4" y="8" width="16" height="12" rx="2" stroke="#06b6d4" stroke-width="1.5" fill="none"/>
        <circle cx="8" cy="14" r="1.5" fill="#06b6d4"/>
        <circle cx="16" cy="14" r="1.5" fill="#06b6d4"/>
        <path d="M12 4v4M8 4h8" stroke="#06b6d4" stroke-width="1.5" stroke-linecap="round"/>
      </g>
    </g>
  </g>

  <!-- Hexagon 3: Amber (top-right) - Digital Transformation -->
  <g class="hex-float" style="animation-delay: 2s;">
    <g transform="translate(760, 210)">
      <polygon points="0,-52 45,-26 45,26 0,52 -45,26 -45,-26" fill="#0f172a" stroke="url(#hex-amber)" stroke-width="2" opacity="0.85" class="hex-glow" style="animation-delay: 1s;"/>
      <polygon points="0,-38 33,-19 33,19 0,38 -33,19 -33,-19" fill="none" stroke="#f59e0b" stroke-width="0.5" opacity="0.2"/>
      <!-- Zap icon -->
      <g opacity="0.7" transform="translate(-10, -16)">
        <path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z" stroke="#f59e0b" stroke-width="1.5" fill="none" stroke-linejoin="round"/>
      </g>
    </g>
  </g>

  <!-- Hexagon 4: Emerald (bottom-left) - Web Development -->
  <g class="hex-float" style="animation-delay: 0.5s;">
    <g transform="translate(360, 350)">
      <polygon points="0,-52 45,-26 45,26 0,52 -45,26 -45,-26" fill="#0f172a" stroke="url(#hex-emerald)" stroke-width="2" opacity="0.8" class="hex-glow" style="animation-delay: 1.5s;"/>
      <polygon points="0,-38 33,-19 33,19 0,38 -33,19 -33,-19" fill="none" stroke="#10b981" stroke-width="0.5" opacity="0.2"/>
      <!-- Globe icon -->
      <g opacity="0.7" transform="translate(-12, -12)">
        <circle cx="12" cy="12" r="9" stroke="#10b981" stroke-width="1.5" fill="none"/>
        <ellipse cx="12" cy="12" rx="4" ry="9" stroke="#10b981" stroke-width="1" fill="none"/>
        <path d="M3 12h18M4 7h16M4 17h16" stroke="#10b981" stroke-width="0.8" fill="none"/>
      </g>
    </g>
  </g>

  <!-- Hexagon 5: Pink (bottom-center-left) - Social Media -->
  <g class="hex-float" style="animation-delay: 1.5s;">
    <g transform="translate(520, 350)">
      <polygon points="0,-52 45,-26 45,26 0,52 -45,26 -45,-26" fill="#0f172a" stroke="url(#hex-pink)" stroke-width="2" opacity="0.8" class="hex-glow" style="animation-delay: 2s;"/>
      <polygon points="0,-38 33,-19 33,19 0,38 -33,19 -33,-19" fill="none" stroke="#ec4899" stroke-width="0.5" opacity="0.2"/>
      <!-- Share icon -->
      <g opacity="0.7" transform="translate(-12, -12)">
        <circle cx="18" cy="5" r="3" stroke="#ec4899" stroke-width="1.5" fill="none"/>
        <circle cx="6" cy="12" r="3" stroke="#ec4899" stroke-width="1.5" fill="none"/>
        <circle cx="18" cy="19" r="3" stroke="#ec4899" stroke-width="1.5" fill="none"/>
        <path d="M8.6 10.5l6.8 3M8.6 13.5l6.8-3" stroke="#ec4899" stroke-width="1.2"/>
      </g>
    </g>
  </g>

  <!-- Hexagon 6: Indigo (bottom-center-right & bottom-right) - Agile -->
  <g class="hex-float" style="animation-delay: 2.5s;">
    <g transform="translate(680, 350)">
      <polygon points="0,-52 45,-26 45,26 0,52 -45,26 -45,-26" fill="#0f172a" stroke="url(#hex-indigo)" stroke-width="2" opacity="0.8" class="hex-glow" style="animation-delay: 2.5s;"/>
      <polygon points="0,-38 33,-19 33,19 0,38 -33,19 -33,-19" fill="none" stroke="#6366f1" stroke-width="0.5" opacity="0.2"/>
      <!-- Kanban icon -->
      <g opacity="0.7" transform="translate(-12, -14)">
        <rect x="2" y="4" width="6" height="16" rx="1.5" stroke="#6366f1" stroke-width="1.3" fill="none"/>
        <rect x="10" y="4" width="6" height="10" rx="1.5" stroke="#6366f1" stroke-width="1.3" fill="none"/>
        <rect x="18" y="4" width="6" height="13" rx="1.5" stroke="#6366f1" stroke-width="1.3" fill="none"/>
      </g>
    </g>
  </g>

  <!-- Bottom-right hex placeholder -->
  <g class="hex-float" style="animation-delay: 3s;">
    <g transform="translate(840, 350)">
      <polygon points="0,-52 45,-26 45,26 0,52 -45,26 -45,-26" fill="#0f172a" stroke="#14b8a6" stroke-width="1.5" opacity="0.5" class="hex-glow" style="animation-delay: 3s;"/>
      <!-- Blocks icon -->
      <g opacity="0.5" transform="translate(-12, -12)">
        <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5" stroke="#14b8a6" stroke-width="1.3" fill="none" stroke-linejoin="round"/>
      </g>
    </g>
  </g>

  <!-- Floating geometric shapes -->
  <g class="shape-anim" opacity="0.15">
    <polygon points="120,120 135,95 150,120" fill="none" stroke="#8b5cf6" stroke-width="1.2"/>
  </g>
  <g class="shape-anim2" style="animation-delay: 2s;" opacity="0.12">
    <rect x="1040" y="140" width="22" height="22" rx="3" fill="none" stroke="#06b6d4" stroke-width="1.2" transform="rotate(45 1051 151)"/>
  </g>
  <g class="shape-anim" style="animation-delay: 1s;" opacity="0.1">
    <polygon points="180,460 195,435 210,460" fill="none" stroke="#f59e0b" stroke-width="1"/>
  </g>
  <g class="shape-anim2" style="animation-delay: 3s;" opacity="0.1">
    <rect x="1000" y="420" width="18" height="18" rx="2" fill="none" stroke="#10b981" stroke-width="1" transform="rotate(30 1009 429)"/>
  </g>
  <g class="shape-anim" style="animation-delay: 4s;" opacity="0.08">
    <circle cx="280" cy="100" r="8" fill="none" stroke="#ec4899" stroke-width="1"/>
  </g>
  <g class="shape-anim2" style="animation-delay: 1.5s;" opacity="0.08">
    <circle cx="920" cy="500" r="10" fill="none" stroke="#6366f1" stroke-width="1"/>
  </g>

  <!-- Ambient particles -->
  <circle cx="100" cy="300" r="2" fill="#8b5cf6" opacity="0.2">
    <animate attributeName="opacity" values="0.1;0.3;0.1" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1100" cy="300" r="2" fill="#06b6d4" opacity="0.2">
    <animate attributeName="opacity" values="0.1;0.3;0.1" dur="5s" repeatCount="indefinite" begin="1s"/>
  </circle>
  <circle cx="600" cy="500" r="1.5" fill="#f59e0b" opacity="0.15">
    <animate attributeName="opacity" values="0.08;0.2;0.08" dur="3.5s" repeatCount="indefinite" begin="2s"/>
  </circle>
  <circle cx="200" cy="200" r="1.5" fill="#10b981" opacity="0.15">
    <animate attributeName="opacity" values="0.08;0.2;0.08" dur="4.5s" repeatCount="indefinite" begin="0.5s"/>
  </circle>
  <circle cx="1000" cy="150" r="1" fill="#ec4899" opacity="0.1">
    <animate attributeName="opacity" values="0.05;0.15;0.05" dur="5s" repeatCount="indefinite" begin="3s"/>
  </circle>

  <!-- Data flow particles on connections -->
  <circle r="2.5" fill="#8b5cf6" opacity="0.7" filter="url(#svc-glow)">
    <animateMotion dur="3s" repeatCount="indefinite" path="M440,210 L600,210"/>
    <animate attributeName="opacity" values="0;0.7;0.7;0" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle r="2" fill="#06b6d4" opacity="0.6" filter="url(#svc-glow)">
    <animateMotion dur="3.5s" repeatCount="indefinite" path="M600,210 L760,210" begin="0.5s"/>
    <animate attributeName="opacity" values="0;0.6;0.6;0" dur="3.5s" repeatCount="indefinite" begin="0.5s"/>
  </circle>
  <circle r="2" fill="#f59e0b" opacity="0.5" filter="url(#svc-glow)">
    <animateMotion dur="4s" repeatCount="indefinite" path="M360,350 L520,350" begin="1s"/>
    <animate attributeName="opacity" values="0;0.5;0.5;0" dur="4s" repeatCount="indefinite" begin="1s"/>
  </circle>
  <circle r="2" fill="#10b981" opacity="0.5" filter="url(#svc-glow)">
    <animateMotion dur="4s" repeatCount="indefinite" path="M520,350 L680,350" begin="1.5s"/>
    <animate attributeName="opacity" values="0;0.5;0.5;0" dur="4s" repeatCount="indefinite" begin="1.5s"/>
  </circle>
  <circle r="1.5" fill="#ec4899" opacity="0.4" filter="url(#svc-glow)">
    <animateMotion dur="4.5s" repeatCount="indefinite" path="M680,350 L840,350" begin="2s"/>
    <animate attributeName="opacity" values="0;0.4;0.4;0" dur="4.5s" repeatCount="indefinite" begin="2s"/>
  </circle>
</svg>